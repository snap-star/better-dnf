# GitHub Actions Workflow for Automatic COPR Builds
# Builds from a git tag and submits the package to COPR via copr-cli.

name: Build and Publish to COPR

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

# NOTE: the primary trigger is the tag push. Releases created by release.yml
# use the repository's GITHUB_TOKEN, and GitHub deliberately does not create
# workflow runs from events produced by GITHUB_TOKEN (anti-recursion rule), so
# a workflow-created release never fires `on: release` - the run list for this
# workflow was empty despite a published v1.1.1 release. The `release` trigger
# is kept for releases published manually from the web UI, and
# `workflow_dispatch` allows manual rebuilds.

env:
  COPR_OWNER: snap-star
  COPR_PROJECT: better-dnf

jobs:
  copr-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install copr-cli
        run: |
          python -m pip install --upgrade pip
          # rich is an undeclared runtime dependency of copr-cli 2.5 (it
          # imports it at startup but omits it from its package metadata) -
          # installing it explicitly keeps `copr-cli build` from crashing
          # with ModuleNotFoundError.
          pip install copr-cli rich

      - name: Configure COPR CLI
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Extract version from release tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Trigger COPR build
        run: |
          echo "Triggering COPR build for better-dnf ${{ steps.version.outputs.version }}"
          
          # Build from the GitHub release tag (SCM build).
          # No PyPI upload is needed - COPR clones the tagged source
          # and auto-detects better-dnf.spec at the repo root.
          # copr-cli 2.5 uses the `buildscm` subcommand (the old
          # `build <project> scm` form was removed).
          copr-cli buildscm ${{ env.COPR_OWNER }}/${{ env.COPR_PROJECT }} \
            --clone-url https://github.com/${{ env.COPR_OWNER }}/better-dnf \
            --commit v${{ steps.version.outputs.version }}
          
          echo ""
          echo "✅ Build triggered successfully!"
          echo "📊 Monitor at: https://copr.fedorainfracloud.org/coprs/${{ env.COPR_OWNER }}/${{ env.COPR_PROJECT }}/builds/"

      - name: Print installation instructions
        run: |
          echo ""
          echo "📦 Users can install with:"
          echo "   sudo dnf copr enable ${{ env.COPR_OWNER }}/${{ env.COPR_PROJECT }}"
          echo "   sudo dnf install better-dnf"
