[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-dnf"
version = "0.1.0"
description = "A smarter DNF update tool that categorizes updates and lets you choose what to install safely"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "snap-star", email = "rendiyuspramana@gmail.com" },
]
keywords = ["fedora", "dnf", "updates", "package-manager", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=1.10.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
better-dnf = "better_dnf.cli:app"

[project.urls]
Homepage = "https://github.com/snap-star/better-dnf"
Repository = "https://github.com/snap-star/better-dnf"
Issues = "https://github.com/snap-star/better-dnf/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/better_dnf"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]